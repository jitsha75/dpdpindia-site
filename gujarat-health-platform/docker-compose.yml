  # ---- optional 'full' profile: SSO, BPMN engine, self-hosted LLM, object store (./start.sh --full; needs ~6 GB more RAM)
  keycloak:
    profiles: [full]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev"]
    environment: [KC_BOOTSTRAP_ADMIN_USERNAME=admin, KC_BOOTSTRAP_ADMIN_PASSWORD=admin, KC_HTTP_RELATIVE_PATH=/auth]
    networks: [backend]
  ollama:
    profiles: [full]
    image: ollama/ollama:latest
    volumes: [ollama_data:/root/.ollama]
    networks: [backend]
  minio:
    profiles: [full]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: [MINIO_ROOT_USER=ghip, MINIO_ROOT_PASSWORD=ghip-demo-minio-pw]
    volumes: [minio_data:/data]
    networks: [backend]
